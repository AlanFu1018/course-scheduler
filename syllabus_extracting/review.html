<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人課程覆核</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;color:#182a38;background:#f5f7f9}h1{font-size:1.8rem}section,article{background:white;border:1px solid #dbe3e8;border-radius:10px;padding:1.2rem;margin:1rem 0}label{display:block;margin:.7rem 0}input,textarea{font:inherit;padding:.45rem;border:1px solid #9babb5;border-radius:5px;box-sizing:border-box}input[type=text],input[type=number],input[type=date],textarea{width:100%}textarea{min-height:70px}button{font:inherit;padding:.55rem .9rem;margin:.3rem .35rem .3rem 0;cursor:pointer;background:#135c80;color:white;border:0;border-radius:5px}.muted{color:#566b78}.badge{display:inline-block;padding:.1rem .5rem;border-radius:1rem;background:#f5e5b1}.confirmed{background:#d8eddd}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}.hidden{display:none}small{display:block;color:#566b78}#message{white-space:pre-wrap}</style>
<h1>個人課程覆核</h1><section><label>測試使用者 ID<input id="userId" value="demo_user"></label><button id="switchUser">切換使用者</button><small id="currentUser">目前：demo_user</small></section><p class="muted">先選課，再檢查課綱分析並儲存自己的版本。</p>
<section id="search"><h2>查詢課程</h2><form id="searchForm"><div class="row"><label>學期<input name="semester" value="1151" required pattern="[0-9]{4}"></label><label>課名或關鍵字<input name="keyword" value="Computer Network" required></label></div><button>搜尋</button></form><div id="results"></div></section>
<p id="message" role="status"></p><main id="review" class="hidden"><h2 id="heading"></h2><p id="provenance" class="muted"></p><div id="editor"></div><button id="save">確認並儲存個人課程</button><p id="saveMessage" role="status"></p></main>
<script>
let semester,serial,original,draft,userId='demo_user';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#switchUser').onclick=()=>{let next=$('#userId').value.trim();if(!/^[A-Za-z0-9_-]+$/.test(next)){$('#message').textContent='使用者 ID 格式錯誤';return}userId=next;serial=undefined;draft=undefined;original=undefined;$('#review').classList.add('hidden');$('#currentUser').textContent='目前：'+userId;$('#message').textContent='已切換使用者，請重新選課。'};
const api=async(url,opts)=>{let r=await fetch(url,opts),d=await r.json();if(!r.ok)throw Error(d.error||'請求失敗');return d};
const field=(label,path,value,type='text')=>`<label>${label}<input data-path="${path}" type="${type}" value="${esc(value)}"></label>`;
const area=(label,path,value)=>`<label>${label}<textarea data-path="${path}">${esc(value)}</textarea></label>`;
const status=s=>`<span class="badge ${s==='confirmed'?'confirmed':''}">${s==='confirmed'?'課綱明載':s==='estimated'?'推估':'使用者修改'}</span>`;
const date=v=>v||'';
$('#searchForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);semester=f.get('semester').trim();$('#message').textContent='正在搜尋…';try{let rows=await api('/api/v1/courses/search?'+new URLSearchParams({semester,keyword:f.get('keyword')}));$('#results').innerHTML=rows.length?rows.map(x=>`<article><strong>${esc(x.name)}</strong><p>${esc(x.code)}｜${esc(x.instructor)}｜${esc(x.sessions_raw)}｜序號 ${esc(x.serial_no)}</p><small>${x.analysis_exists?'已有分析':'需要產生分析'}</small><button data-serial="${esc(x.serial_no)}">選擇這門課</button></article>`).join(''):'沒有找到課程';$('#message').textContent='';}catch(err){$('#message').textContent=err.message}};
$('#results').onclick=e=>{let b=e.target.closest('[data-serial]');if(b)openCourse(b.dataset.serial)};
async function openCourse(n){serial=n;$('#message').textContent='正在取得課綱分析…';try{let q=new URLSearchParams({semester,serial_no:serial,user_id:userId});let analysis=await api('/api/v1/analyses?'+q);draft=await api('/api/v1/user-courses?'+q);if(draft.user_id!==userId)throw Error('服務仍在執行舊版，請重新啟動 python web.py');original=structuredClone(draft);$('#heading').textContent=`${draft.course.name}（${draft.course.code}）`;$('#provenance').textContent=`分析 ${analysis.analysis_id}｜來源 ${analysis.sources.map(s=>s.role).join('、')}｜推估進度僅供規劃參考`;render();$('#review').classList.remove('hidden');$('#message').textContent='請檢查資料；修改後才會儲存。';}catch(err){$('#message').textContent=err.message}}
function render(){let c=draft.course,html=`<section><h3>課程資料</h3><div class="row">${field('中文課名','course.name',c.name)}${field('英文課名','course.name_en',c.name_en)}${field('教師','course.instructor',c.instructor)}${field('學分','course.credits',c.credits,'number')}${field('開始日','start_date',date(draft.start_date),'date')}${field('結束日','end_date',date(draft.end_date),'date')}</div><h4>上課時段</h4>`;
c.sessions.forEach((s,i)=>html+=`<div class="row">${field('星期 1–7',`course.sessions.${i}.weekday`,s.weekday,'number')}${field('開始',`course.sessions.${i}.start_time`,s.start_time,'time')}${field('結束',`course.sessions.${i}.end_time`,s.end_time,'time')}${field('教室',`course.sessions.${i}.room`,s.room)}</div>`);
html+=`<small>原始節次：${esc(c.sessions_raw)}</small></section><section><h3>評分</h3>`;
draft.grading.forEach((g,i)=>html+=`<article>${field('類別',`grading.${i}.category`,g.category)}${field('比例 %',`grading.${i}.weight.value`,g.weight.value,'number')}${status(g.weight.status)}<small>依據：${esc(g.weight.evidence)}</small></article>`);
html+='</section><section><h3>評量</h3>';
draft.assessments.forEach((a,i)=>html+=`<article><div class="row">${field('名稱',`assessments.${i}.title`,a.title)}${field('日期',`assessments.${i}.date.value`,date(a.date.value),'date')}${field('比例 %',`assessments.${i}.weight.value`,a.weight.value,'number')}${field('考試範圍的教材章節',`assessments.${i}.scope.value`,a.scope.value.join(', '))}</div>${area('備註',`assessments.${i}.note`,a.note)}<small>若課綱列出教材章節，可填代號，例如 Ch1, Ch2；沒有可留空。日期：${esc(a.date.evidence)}｜比例：${esc(a.weight.evidence)}｜範圍：${esc(a.scope.evidence)}</small></article>`);
html+='</section><section><h3>每週進度</h3><p class="muted">推估內容不是教師公布的進度。</p>';
draft.weekly_schedule.forEach((w,i)=>html+=`<article><strong>第 ${w.week} 週</strong> ${status(w.status)}${area('本週上課主題（每行一項）',`weekly_schedule.${i}.topics`,w.topics.join('\n'))}<div class="row">${field('本週對應的教材章節',`weekly_schedule.${i}.chapters`,w.chapters.join(', '))}${field('開始日期',`weekly_schedule.${i}.date_range.start`,w.date_range[0]||'','date')}${field('結束日期',`weekly_schedule.${i}.date_range.end`,w.date_range[1]||'','date')}</div><small>章節例：Ch1, Ch2；只填教材清單已有的代號，沒有可留空。日期不知道可兩格都留空。</small></article>`);
$('#editor').innerHTML=html+'</section>'}
$('#editor').oninput=e=>{let path=e.target.dataset.path;if(!path)return;let keys=path.split('.'),obj=draft;if(path.endsWith('.date_range.start')||path.endsWith('.date_range.end')){let row=draft.weekly_schedule[Number(keys[1])],pair=[row.date_range[0]||'',row.date_range[1]||''];pair[path.endsWith('.start')?0:1]=e.target.value;row.date_range=pair.some(Boolean)?pair:[];return}for(let k of keys.slice(0,-1))obj=obj[k];let v=e.target.value;if(e.target.type==='number')v=v===''?null:Number(v);else if(e.target.type==='date')v=v||null;else if(keys.at(-1)==='topics')v=v.split('\n').map(x=>x.trim()).filter(Boolean);else if(keys.at(-1)==='chapters'||path.endsWith('scope.value'))v=v.split(',').map(x=>x.trim()).filter(Boolean);obj[keys.at(-1)]=v};
$('#save').onclick=async()=>{let payload={semester,serial_no:serial,user_id:userId,course:draft};$('#saveMessage').textContent='正在儲存…';try{let r=await api('/api/v1/user-courses',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});draft=r.course;original=structuredClone(draft);render();$('#saveMessage').textContent='已儲存：'+r.path}catch(err){$('#saveMessage').textContent='儲存失敗：'+err.message}};
</script></html>
